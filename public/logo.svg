
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#logoGradient)" />
  
  <!-- Refrigerant Symbol - Stylized Snowflake/Cooling Icon -->
  <g transform="translate(32,32)">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="3" fill="white" />
    
    <!-- Main cross lines -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Diagonal lines -->
    <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="8.5" y1="-8.5" x2="-8.5" y2="8.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Small circles at ends -->
    <circle cx="12" cy="0" r="2" fill="white" />
    <circle cx="-12" cy="0" r="2" fill="white" />
    <circle cx="0" cy="12" r="2" fill="white" />
    <circle cx="0" cy="-12" r="2" fill="white" />
    
    <!-- Letter A and R -->
    <text x="-18" y="-18" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">A</text>
    <text x="12" y="-18" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">R</text>
  </g>
  
  <!-- Company name arc -->
  <path id="companyArc" d="M 8,32 A 24,24 0 0,1 56,32" fill="none" />
  <text font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">
    <textPath href="#companyArc" startOffset="50%" text-anchor="middle">
      ALPER REFRIGERANTS
    </textPath>
  </text>
</svg>
