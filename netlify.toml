[[plugins]]
  package = "@netlify/plugin-prerender"

  [plugins.inputs]
    prerenderToken = "PRERENDER_TOKEN"
    botHeaderKey = "X-Prerender"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://embed.tawk.to https://www.googletagmanager.com https://www.google-analytics.com https://cdn.tiny.cloud https://js.stripe.com https://checkout.stripe.com https://connect.facebook.net https://consent.cookiebot.com https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.lovable.app https://*.tawk.to wss://*.tawk.to https://www.google-analytics.com https://www.merchant-center-analytics.goog https://api.stripe.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://*.tawk.to https://fonts.googleapis.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://*.tawk.to https://www.google-analytics.com https://www.facebook.com; frame-src 'self' https://*.tawk.to https://www.google.com https://www.youtube.com https://js.stripe.com https://hooks.stripe.com https://hcaptcha.com https://*.hcaptcha.com https://newassets.hcaptcha.com; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "on"
    X-XSS-Protection = "1; mode=block"
