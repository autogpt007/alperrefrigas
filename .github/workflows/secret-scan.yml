name: Security Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Detection Scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    - name: Custom Secret Pattern Scan
      run: |
        echo "🔍 Running custom secret pattern scan..."
        
        # Define secret patterns
        patterns=(
          "sk_live_[a-zA-Z0-9]{24}"
          "sk_test_[a-zA-Z0-9]{24}"
          "AKIA[0-9A-Z]{16}"
          "eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"
          "xoxp-[0-9]+-[0-9]+-[0-9]+-[a-f0-9]{32}"
          "ghp_[A-Za-z0-9]{36}"
          "github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}"
          "['\"].*[A-Za-z0-9+/=]{40,}['\"]"
        )
        
        issues_found=false
        
        for pattern in "${patterns[@]}"; do
          echo "Searching for pattern: $pattern"
          if grep -r -E "$pattern" . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github; then
            echo "❌ SECURITY ISSUE: Found potential secret matching pattern: $pattern"
            issues_found=true
          fi
        done
        
        # Check for environment files
        echo "🔒 Checking for risky files..."
        if find . -name ".env*" -not -path "./.git/*" -not -name ".env.example" | grep -q .; then
          echo "❌ SECURITY ISSUE: Environment files found in repository"
          find . -name ".env*" -not -path "./.git/*" -not -name ".env.example"
          issues_found=true
        fi
        
        # Check for private keys
        if find . -name "*.pem" -o -name "*.key" -o -name "id_rsa*" -o -name "id_dsa*" | grep -q .; then
          echo "❌ SECURITY ISSUE: Private key files found"
          find . -name "*.pem" -o -name "*.key" -o -name "id_rsa*" -o -name "id_dsa*"
          issues_found=true
        fi
        
        if [ "$issues_found" = true ]; then
          echo "❌ Security scan failed! Secrets or sensitive files detected."
          exit 1
        else
          echo "✅ Security scan passed! No secrets detected."
        fi

    - name: Scan for Hardcoded Supabase Credentials
      run: |
        echo "🔍 Scanning for hardcoded Supabase credentials..."
        
        # Check for hardcoded Supabase URLs and keys
        if grep -r -E "https://[a-z]+\.supabase\.co" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
          echo "⚠️  WARNING: Hardcoded Supabase URLs found. Please use environment variables."
        fi
        
        # Check for JWT tokens in code
        if grep -r -E "eyJ[A-Za-z0-9_-]{20,}" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
          echo "❌ SECURITY ISSUE: Potential JWT tokens found hardcoded in source code"
          exit 1
        fi
        
        echo "✅ Supabase credential scan completed"

    - name: Check Package Dependencies
      run: |
        echo "📦 Checking for known vulnerable packages..."
        
        if [ -f "package.json" ]; then
          npm audit --audit-level=high || echo "⚠️  High severity vulnerabilities found in dependencies"
        fi
        
        echo "✅ Dependency scan completed"

  dependency-scan:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: |
        echo "🔍 Running npm security audit..."
        npm audit --audit-level=moderate
        
    - name: Run license check
      run: |
        echo "📄 Checking package licenses..."
        npx license-checker --summary --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD'